name: iOS build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 tools/build.py
      - name: Install a headless browser
        run: npm i --no-save --no-package-lock playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Smoke test
        run: node tests/smoke.js

  build:
    needs: smoke
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run sync:ios
      - name: Build (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          test -d build/Build/Products/Release-iphoneos/App.app
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload && cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry anora-unsigned.ipa Payload
          ls -la anora-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: anora-ios-unsigned
          path: anora-unsigned.ipa
      - name: Publish the test IPA next to the APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view test >/dev/null 2>&1 || gh release create test --prerelease --title "أنورا - نسخة تجريبية" --notes "نسخة تجريبية تتحدث مع كل تعديل."
          gh release upload test anora-unsigned.ipa --clobber
