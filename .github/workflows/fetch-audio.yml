name: Fetch audio timings

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_audio.py
      - name: Commit the compact timing files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/audio
          git diff --cached --quiet || (git commit -m "Update MP3Quran ayah timings" && git push)
