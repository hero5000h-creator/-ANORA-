name: Android APK

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 tools/build.py
      - name: Install a headless browser
        run: npm i --no-save --no-package-lock playwright@1.63.0 && npx playwright install --with-deps chromium
      - name: Smoke test (load, text lock, recitation keeps playing, settings on screen)
        run: node tests/smoke.js

  build:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run sync
      - name: Load the fixed test signing key
        env:
          KEY_B64: ${{ secrets.ANORA_TEST_KEYSTORE_B64 }}
          KEY_PW: ${{ secrets.ANORA_TEST_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEY_B64" ]; then
            # pasted secrets often pick up spaces or line breaks; drop them
            KEY_PW=$(printf %s "$KEY_PW" | tr -d '[:space:]')
            printf %s "$KEY_B64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/anora-test.jks"
            if ! keytool -list -keystore "$RUNNER_TEMP/anora-test.jks" -storepass "$KEY_PW" -alias anora-test >/dev/null 2>&1; then
              echo "::error::The test key secrets do not match: ANORA_TEST_KEYSTORE_PASSWORD does not open ANORA_TEST_KEYSTORE_B64 (or one was pasted incompletely)."
              exit 1
            fi
            echo "ANORA_TEST_KEYSTORE=$RUNNER_TEMP/anora-test.jks" >> "$GITHUB_ENV"
            echo "ANORA_TEST_KEYSTORE_PASSWORD=$KEY_PW" >> "$GITHUB_ENV"
          else
            echo "::warning::ANORA_TEST_KEYSTORE_B64 secret is missing: this APK gets a one-off key and will not install over the previous build."
          fi
      - name: Build debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: anora-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish the test APK as a public download
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk anora.apk
          gh release view test >/dev/null 2>&1 || gh release create test --prerelease --title "أنورا - نسخة تجريبية" --notes "نسخة تجريبية تتحدث مع كل تعديل."
          gh release upload test anora.apk --clobber
