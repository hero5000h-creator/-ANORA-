name: Quran recogniser check

# The own Quran recogniser is native code (ONNX Runtime): check it on a real ARM processor and inside the app on an
# Android emulator, where its own process (":qasr") must never take the app down with it.
on:
  pull_request:
    paths:
      - 'android/**'
      - 'tests/qasr/**'
      - '.github/workflows/qasr.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  arm:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: ONNX Runtime, the same version as the app
        run: |
          v=$(grep -o 'onnxruntime-android:[0-9.]*' android/app/build.gradle | cut -d: -f2)
          curl -fsSL --retry 4 -o ort.jar "https://repo1.maven.org/maven2/com/microsoft/onnxruntime/onnxruntime/$v/onnxruntime-$v.jar"
      - name: Decode on ARM (stream, whole window, short input; 1 and 2 threads)
        run: |
          J=android/app/src/main/java/app/anora/quran
          javac -encoding UTF-8 -cp ort.jar -d out $J/QuranAsr.java $J/QuranListen.java tests/qasr/Noise.java
          java -cp ort.jar:out Noise android/app/src/main/assets/qasr/model.onnx | tee log.txt
          grep -q "QASR OK" log.txt

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run sync
      - name: Build a debug APK that also runs on the x86_64 emulator
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug -PqasrX86 --no-daemon
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run the recogniser inside the app, then end its process
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tests/qasr/emulator.sh android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qasr-logcat
          path: logcat.txt
